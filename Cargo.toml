[workspace]
resolver = "3"
members = ["crates/kestrel-core", "crates/kestrel-openapi", "crates/kestrel-import", "crates/kestrel-codegen", "crates/kestrel-cli", "crates/kestrel-app"]
default-members = ["crates/kestrel-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/e1berd/kestrel"
rust-version = "1.88"

[workspace.dependencies]
kestrel-core = { path = "crates/kestrel-core" }
kestrel-openapi = { path = "crates/kestrel-openapi" }
kestrel-import = { path = "crates/kestrel-import" }
kestrel-codegen = { path = "crates/kestrel-codegen" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "multipart", "cookies", "socks"] }
futures = "0.3"
url = "2"
percent-encoding = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.9"
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
dirs = "6"
notify = "8"
yaml-rust2 = { version = "0.13.0", default-features = false }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.dev]
# GPUI is slow unoptimised; our own code stays quick to build.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
