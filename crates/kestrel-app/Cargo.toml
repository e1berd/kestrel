[package]
name = "kestrel-app"
description = "Kestrel, the desktop app: a free, file-based API client on GPUI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kestrel"
path = "src/main.rs"

[dependencies]
kestrel-core.workspace = true
kestrel-openapi.workspace = true
kestrel-import.workspace = true
kestrel-codegen.workspace = true
anyhow.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
serde_yaml_ng.workspace = true
dirs.workspace = true
notify.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10" }
gpui-component = { version = "0.8.1", features = ["tree-sitter", "tree-sitter-javascript", "tree-sitter-html"] }
gpui-kit-assets = "0.8.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# reqwest and gpui both bring rustls; main() picks ring before the first TLS connection.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["runtime_shaders"] }
