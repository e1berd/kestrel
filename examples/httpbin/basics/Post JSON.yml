info:
  name: Post JSON
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/post"
  body:
    type: json
    data: |-
      {
        "user": "{{user}}",
        "id": "{{$randomUUID}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar('sentAt', new Date().toISOString());
    - type: after-response
      code: bru.setVar('echoedUser', res.body.json.user);
    - type: tests
      code: |-
        test('echoes the body', () => {
          expect(res.body.json.user).to.equal(bru.getEnvVar('user'));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
